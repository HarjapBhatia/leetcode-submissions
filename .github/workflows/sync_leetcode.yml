name: Sync Leetcode

on:
  workflow_dispatch: # Allows you to trigger this manually at any time
  schedule:
    - cron: '0 8 * * 6' # Automatically checks and syncs every Saturday at 8:00 AM

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Run LeetCode Sync
        uses: joshcai/leetcode-sync@v1.7.0 # Authoritative marketplace tool
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          leetcode-csrf-token: ${{ secrets.LEETCODE_CSRF_TOKEN }}
          leetcode-session: ${{ secrets.LEETCODE_SESSION }}
          destination-folder: 'solutions' # Folder where code will live
          verbose: true
